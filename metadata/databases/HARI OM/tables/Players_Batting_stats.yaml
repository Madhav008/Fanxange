table:
  name: Batting_stats
  schema: Players
object_relationships:
  - name: Match
    using:
      foreign_key_constraint_on: match_id
array_relationships:
  - name: Player_match_stats
    using:
      foreign_key_constraint_on:
        column: batting_stats_id
        table:
          name: Player_match_stats
          schema: Players

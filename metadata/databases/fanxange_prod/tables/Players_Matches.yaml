table:
  name: Matches
  schema: Players
object_relationships:
  - name: Tournament
    using:
      foreign_key_constraint_on: tournament_id
array_relationships:
  - name: Batting_stats
    using:
      foreign_key_constraint_on:
        column: match_id
        table:
          name: Batting_stats
          schema: Players
  - name: Bowling_stats
    using:
      foreign_key_constraint_on:
        column: match_id
        table:
          name: Bowling_stats
          schema: Players
  - name: Filding_stats
    using:
      foreign_key_constraint_on:
        column: match_id
        table:
          name: Filding_stats
          schema: Players
  - name: Player_match_stats
    using:
      foreign_key_constraint_on:
        column: match_id
        table:
          name: Player_match_stats
          schema: Players
  - name: Playing_xis
    using:
      foreign_key_constraint_on:
        column: match_id
        table:
          name: Playing_xi
          schema: Players
